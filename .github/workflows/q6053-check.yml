name: Q6053 standalone Lean check

on:
  push:
    branches: [q6053-check]
    paths:
      - 'q6053/**'
      - '.github/workflows/q6053-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: |
          cd q6053/check
          lake update
          lake exe cache get
      - name: Apply proof repair
        run: |
          cd q6053/check
          git apply fix.patch
      - name: Check Packet 24
        run: |
          cd q6053/check
          lake build Agafonov.Kamae1973.FillExpectation
