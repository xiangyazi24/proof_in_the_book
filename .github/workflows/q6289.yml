name: Verify Packet K against pinned source

on:
  push:
    branches: [q6289-verify]
    paths:
      - 'q6289/**'
      - '.github/workflows/q6289.yml'

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@v4
      - name: Checkout pinned source repository
        uses: actions/checkout@v4
        with:
          repository: xiangyazi24/agafonov
          ref: e07c7b6
          path: source
      - name: Overlay Packet K candidate
        run: cp q6289/CompactNormalityDescends.lean source/Agafonov/Kamae1973/CompactNormalityDescends.lean
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib and cache
        working-directory: source
        run: |
          lake update
          lake exe cache get
      - name: Build Packet K
        working-directory: source
        run: lake build Agafonov.Kamae1973.CompactNormalityDescends
