name: Q6098 standalone Lean check

on:
  push:
    branches: [q6098-check]
    paths:
      - 'q6098/**'
      - '.github/workflows/q6098-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Apply remaining repairs
        run: |
          file=q6098/check/Agafonov/Kamae1973/FiniteStagePrefixEstimate.lean
          grep -q 'import Mathlib.Data.Fintype.BigOperators' "$file" || \
            sed -i '/import Mathlib.Algebra.BigOperators.Group.Finset.Sigma/a import Mathlib.Data.Fintype.BigOperators' "$file"
          perl -0pi -e 's/rw \[internalOccurrenceCount_cast_sum_private\]\n      rfl/rw [internalOccurrenceCount_cast_sum_private]\n      simp only [prefixInternalHit]/' "$file"
          perl -0pi -e 's/prefixInternalStartSet param\.macroLength param\.blockLength/prefixInternalStartSet (Q := param.blocksPerMacro) param.macroLength param.blockLength/g' "$file"
          if grep -q 'exact mul_le_mul_of_nonneg_right htyp (Nat.cast_nonneg L)' "$file"; then
            awk '
              BEGIN { replacing = 0 }
              !replacing && $0 == "  have hid :" {
                print "  have hid :"
                print "      (internalFrequency u w - P.wordMass (List.ofFn w)) * (L : ℝ) ="
                print "        (internalOccurrenceCount u w : ℝ) -"
                print "          (L : ℝ) * P.wordMass (List.ofFn w) := by"
                print "    unfold internalFrequency"
                print "    field_simp [hLne]"
                print "  have hLnonneg : (0 : ℝ) ≤ (L : ℝ) := Nat.cast_nonneg L"
                print "  calc"
                print "    |(internalOccurrenceCount u w : ℝ) -"
                print "        (L : ℝ) * P.wordMass (List.ofFn w)| ="
                print "      |(internalFrequency u w - P.wordMass (List.ofFn w)) * (L : ℝ)| :="
                print "        congrArg abs hid.symm"
                print "    _ = |internalFrequency u w - P.wordMass (List.ofFn w)| * |(L : ℝ)| :="
                print "      abs_mul _ _"
                print "    _ = |internalFrequency u w - P.wordMass (List.ofFn w)| * (L : ℝ) := by"
                print "      rw [abs_of_nonneg hLnonneg]"
                print "    _ ≤ β * (L : ℝ) :="
                print "      mul_le_mul_of_nonneg_right htyp hLnonneg"
                replacing = 1
                next
              }
              replacing {
                if ($0 == "  exact mul_le_mul_of_nonneg_right htyp (Nat.cast_nonneg L)") replacing = 0
                next
              }
              { print }
            ' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          fi
          perl -0pi -e 's/add_le_add_right hblockLengthBound _/add_le_add_left hblockLengthBound _/' "$file"
          grep -q 'import Mathlib.Data.Fintype.BigOperators' "$file"
          grep -q 'simp only \[prefixInternalHit\]' "$file"
          grep -q 'have hLnonneg' "$file"
          ! grep -q 'add_le_add_right hblockLengthBound' "$file"
          ! grep -q 'prefixInternalStartSet param.macroLength param.blockLength' "$file"
      - name: Preserve repaired candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add q6098/check/Agafonov/Kamae1973/FiniteStagePrefixEstimate.lean
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Complete FiniteStagePrefixEstimate repair'
            git push origin HEAD:q6098-check
          fi
      - name: Resolve pinned dependencies
        run: |
          cd q6098/check
          lake update
          lake exe cache get
      - name: Check repaired packet
        run: |
          cd q6098/check
          lake build Agafonov.Kamae1973.FiniteStagePrefixEstimate
