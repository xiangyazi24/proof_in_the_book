name: Q6051 standalone Lean check

on:
  push:
    branches: [q6051-check]
    paths:
      - 'q6051/**'
      - '.github/workflows/q6051-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: |
          cd q6051/check
          lake update
          lake exe cache get
      - name: Check Packet 26
        run: |
          cd q6051/check
          lake build Agafonov.Kamae1973.PairGenericPainting
