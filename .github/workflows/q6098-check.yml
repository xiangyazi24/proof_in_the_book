name: Q6098 standalone Lean check

on:
  push:
    branches: [q6098-check]
    paths:
      - 'q6098/**'
      - '.github/workflows/q6098-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Assemble repaired packet
        run: |
          file=q6098/check/Agafonov/Kamae1973/FiniteStagePrefixEstimate.lean
          cat q6098/source/part1.lean \
              q6098/source/part2.lean \
              q6098/source/part3.lean \
              q6098/source/part4.lean > "$file"
          set +e
          git apply --recount --reject --directory=q6098/check q6098/fix.patch
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 1
          perl -0pi -e 's/  exact ⟨Nat\.cast_le\.mpr hlowerNat, Nat\.cast_le\.mpr hupperNat⟩/  constructor\n  · exact Nat.cast_le.mpr hlowerNat\n  · rw [← Nat.cast_add]\n    exact Nat.cast_le.mpr hupperNat/' "$file"
          perl -0pi -e 's/unfold stageHit\n  infer_instance/unfold stageHit\n  exact Classical.propDecidable _/' "$file"
          perl -0pi -e 's/unfold prefixInternalHit\n  infer_instance/unfold prefixInternalHit\n  exact Classical.propDecidable _/' "$file"
          rm -f "$file.rej"
          grep -q 'private theorem finApply_eq_of_val_eq' "$file"
          grep -q 'prefixInternalStartSet (Q := Q)' "$file"
          ! grep -q 'exact ⟨Nat.cast_le.mpr hlowerNat' "$file"
      - name: Preserve repaired candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add q6098/check/Agafonov/Kamae1973/FiniteStagePrefixEstimate.lean
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Materialize repaired FiniteStagePrefixEstimate candidate'
            git push origin HEAD:q6098-check
          fi
      - name: Resolve pinned dependencies
        run: |
          cd q6098/check
          lake update
          lake exe cache get
      - name: Check repaired packet
        run: |
          cd q6098/check
          lake build Agafonov.Kamae1973.FiniteStagePrefixEstimate
