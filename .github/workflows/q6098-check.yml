name: Q6098 standalone Lean check

on:
  push:
    branches: [q6098-check]
    paths:
      - 'q6098/**'
      - '.github/workflows/q6098-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve final sum proof
        run: |
          file=q6098/check/Agafonov/Kamae1973/FiniteStagePrefixEstimate.lean
          perl -0pi -e 's/      simp only \[prefixInternalHit\]/      apply Finset.sum_congr rfl\n      intro c _\n      unfold prefixInternalHit\n      by_cases h : ((List.ofFn (label (prefixBlockLift hKH j))).drop c.val).take r = List.ofFn w\n      · rw [if_pos h, if_pos h]\n      · rw [if_neg h, if_neg h]/' "$file"
          grep -q 'by_cases h : ((List.ofFn (label (prefixBlockLift hKH j))).drop c.val).take r' "$file"
          ! grep -q 'simp only \[prefixInternalHit\]' "$file"
      - name: Preserve repaired candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add q6098/check/Agafonov/Kamae1973/FiniteStagePrefixEstimate.lean
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Finish FiniteStagePrefixEstimate sum proof'
            git push origin HEAD:q6098-check
          fi
      - name: Resolve pinned dependencies
        run: |
          cd q6098/check
          lake update
          lake exe cache get
      - name: Check repaired packet
        run: |
          cd q6098/check
          lake build Agafonov.Kamae1973.FiniteStagePrefixEstimate
