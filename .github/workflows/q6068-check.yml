name: Q6068 Packet 30 check

on:
  push:
    branches: [q6068-check]
    paths:
      - 'q6068/**'
      - '.github/workflows/q6068-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain manager
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install candidate module
        run: |
          cp q6068/RandomFillExpectation.lean \
            q6068/check/Agafonov/Kamae1973/RandomFillExpectation.lean
      - name: Resolve pinned dependencies
        run: |
          cd q6068/check
          lake update
          lake exe cache get
      - name: Check Packet 30
        run: |
          cd q6068/check
          lake build Agafonov.Kamae1973.RandomFillExpectation
