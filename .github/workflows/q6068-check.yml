name: Q6068 Packet 30 check

on:
  push:
    branches: [q6068-check]
    paths:
      - 'q6068/**'
      - '.github/workflows/q6068-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain manager
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned source tree
        run: |
          git clone https://github.com/xiangyazi24/agafonov.git source
          cd source
          git checkout 1b07efd
          cp ../q6068/FillExpectation.lean Agafonov/Kamae1973/FillExpectation.lean
          cp ../q6068/RandomFillExpectation.lean Agafonov/Kamae1973/RandomFillExpectation.lean
      - name: Resolve pinned dependencies
        run: |
          cd source
          lake exe cache get
      - name: Check Packet 30
        run: |
          cd source
          lake build Agafonov.Kamae1973.RandomFillExpectation
